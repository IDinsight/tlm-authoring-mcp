site_name: Guide utilisateur — TLM
site_description: Comment utiliser l'outil TLM pour construire un programme d'enseignement, composer et produire les documents qui l'enseignent, et explorer le graphe.
docs_dir: docs

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search
  # Bilingual FR (default) / EN with a language switcher in the header.
  # English pages are the same filename with a `.en.md` suffix (e.g. index.en.md).
  - i18n:
      docs_structure: suffix
      languages:
        - locale: fr
          name: Français
          default: true
        - locale: en
          name: English
          nav_translations:
            Accueil: Home
            Prise en main: Getting started
            Construire le programme: Build the curriculum
            Comprendre le graphe: Understand the graph
            Standards et composantes: Standards & components
            Cours, regroupements et leçons: Courses, groupings & lessons
            Routines pédagogiques: Instructional routines
            Composer et produire des documents: Compose & produce documents
            Composer un document: Compose a document
            Mises en forme: Formatters
            Produire un document: Produce a document
            Évaluer et publier: Evaluate & publish
            Évaluer un document: Evaluate a document
            Relire, publier ou abandonner un brouillon: Review, publish or discard a draft
            Explorer le graphe: Explore the graph
            Administration: Administration
            Référence: Reference

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Prise en main: getting-started.md
  - Construire le programme:
      - Comprendre le graphe: create-graph.md
      - Standards et composantes: build-standards.md
      - Cours, regroupements et leçons: courses-lessons.md
      - Routines pédagogiques: routines.md
  - Composer et produire des documents:
      - Composer un document: compose-document.md
      - Mises en forme: formatters.md
      - Produire un document: create-materials.md
  - Évaluer et publier:
      - Évaluer un document: evaluate.md
      - Relire, publier ou abandonner un brouillon: review-approve.md
  - Explorer le graphe: explorer.md
  - Administration: admin-developer.md
  - Référence: reference.md
